name: Build display image

on:
  schedule:
    - cron: "0 18 * * *"  # daily at 18:00 German time
      timezone: "Europe/Berlin"
    - cron: "0 3 * * *"   # at night, so the previous evening's events go away
      timezone: "Europe/Berlin"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Build termine.png from arminia.de
        run: python3 build.py --out site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  keepalive:
    # GitHub switches off scheduled workflows in public repos after 60 days
    # without activity. Re-enabling the workflow through the API resets that.
    # Only done when neither a commit nor an earlier re-enable happened in the
    # last 45 days: re-enabling every hour seemed to stall the schedule (no
    # scheduled run for hours after the 2026-11-03 15:00 UTC re-enable).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - run: |
          repo="repos/${{ github.repository }}"
          last_commit=$(gh api "$repo/commits?per_page=1" --jq '.[0].commit.committer.date')
          last_enable=$(gh api "$repo/actions/workflows/build.yml" --jq '.updated_at')
          cutoff=$(date -u -d '45 days ago' +%s)
          echo "last commit $last_commit, workflow last updated $last_enable"
          if [ "$(date -u -d "$last_commit" +%s)" -lt "$cutoff" ] && [ "$(date -u -d "$last_enable" +%s)" -lt "$cutoff" ]; then
            gh api -X PUT "$repo/actions/workflows/build.yml/enable"
            echo "re-enabled the schedule"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
