<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tischfußball – Termine</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  img { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<img id="termine" src="termine.png" alt="Termine der Tischfußball-Abteilung">
<script>
  // Load the newest image every 10 minutes; keep the old one if that fails.
  setInterval(function () {
    var next = new Image();
    next.onload = function () { document.getElementById("termine").src = next.src; };
    next.src = "termine.png?t=" + Date.now();
  }, 10 * 60 * 1000);
</script>
</body>
</html>
